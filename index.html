<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu Marca Aquí - Pedidos</title>
    <meta name="description" content="Plantilla de sitio de pedidos por WhatsApp. Personaliza este texto como quieras.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/components/menu.css">
    <link rel="stylesheet" href="css/components/cart.css">
    <link rel="stylesheet" href="css/components/modal.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Header -->
    <header class="main-header" id="main-header">
        <div class="header-container">
            <div class="logo" id="site-logo">
                <!-- Se rellena desde data/business.json -->
            </div>
            <div class="branch-selector-indicator" id="active-branch-indicator">
                📍 Seleccionar Sucursal
            </div>
            <button class="cart-toggle-btn" id="cart-toggle-btn" aria-label="Ver carrito">
                🛒 <span class="cart-badge" id="cart-badge">0</span>
            </button>
        </div>
    </header>

    <!-- Main Layout -->
    <main class="menu-container">
        <section class="hero">
            <h1 id="hero-title">TU MARCA AQUÍ</h1>
            <p id="hero-subtitle">Cargando…</p>
        </section>

        <!-- Menu Categories and Products: se rellena desde data/menu.json -->
        <section class="menu-section" id="menu-section">
            <p style="color: var(--color-text-secondary); font-size: 14px; text-align: center;">Cargando menú…</p>
        </section>
    </main>

    <!-- Sliding Cart -->
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h2>Tu Pedido</h2>
            <button class="cart-close-btn" id="cart-close-btn">&times;</button>
        </div>

        <div class="cart-items-container" id="cart-items-container">
            <!-- Populated by JS -->
            <div class="cart-empty-message">Tu carrito está vacío 🍗</div>
        </div>

        <div class="cart-footer">
            <div class="cart-total-row">
                <span>Total:</span>
                <span class="cart-total-price" id="cart-total-price">$0.00 MXN</span>
            </div>
            <button class="checkout-btn" id="checkout-btn" disabled>Continuar Pedido</button>
        </div>
    </div>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <!-- Branch Selection Modal -->
    <div class="modal" id="branch-modal">
        <div class="modal-content">
            <h2>📍 SELECCIONA TU SUCURSAL</h2>
            <p>Para garantizar los tiempos de preparación y darte la mejor atención, elige tu sucursal más cercana:</p>
            <div class="branch-options" id="branch-options">
                <!-- Se rellena desde data/business.json -->
            </div>
        </div>
    </div>

    <!-- Checkout Details Modal -->
    <div class="modal" id="checkout-modal">
        <div class="modal-content">
            <button class="modal-close-btn" id="checkout-close-btn">&times;</button>
            <h2>📋 CONFIRMA TU PEDIDO</h2>
            <form id="checkout-form">
                <div class="form-group">
                    <label for="customer-name">Tu Nombre:</label>
                    <input type="text" id="customer-name" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="form-group">
                    <label>Método de Entrega:</label>
                    <div class="delivery-methods">
                        <label class="radio-label">
                            <input type="radio" name="delivery-method" value="recoger" checked>
                            <span>Recoger en Sucursal</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="delivery-method" value="domicilio">
                            <span>Envío a Domicilio</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="address-group" style="display: none;">
                    <label for="customer-address">Dirección de Entrega:</label>
                    <input type="text" id="customer-address" placeholder="Calle, Número, Colonia">
                </div>

                <div class="form-group">
                    <label for="customer-notes">Notas / Instrucciones adicionales:</label>
                    <textarea id="customer-notes" placeholder="Ej. Aderezo extra, sin chile, etc."></textarea>
                </div>

                <div class="modal-info-box" id="modal-branch-info">
                    Sucursal de recogida: <strong id="modal-active-branch-name">-</strong>
                </div>

                <button type="submit" class="submit-order-btn" id="submit-order-btn">Confirmar y Enviar a WhatsApp 🍗</button>
            </form>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DEL NEGOCIO ---
        // Todo lo específico de la marca (nombre, sucursales, menú) vive en
        // data/business.json y data/menu.json — para personalizar este sitio
        // para otro negocio, edita esos dos archivos, no este script.
        let business = null;
        let branches = {};

        function getActiveBranchKey() {
            return localStorage.getItem("active_branch");
        }

        function getActiveBranch() {
            const key = getActiveBranchKey();
            return key ? branches[key] : null;
        }

        function setActiveBranch(branchKey) {
            if (branches[branchKey]) {
                localStorage.setItem("active_branch", branchKey);
                updateBranchIndicatorUI(branchKey);
                return true;
            }
            return false;
        }

        function updateBranchIndicatorUI(branchKey) {
            const indicator = document.getElementById("active-branch-indicator");
            const modalBranchName = document.getElementById("modal-active-branch-name");
            const branch = branches[branchKey];

            if (branch) {
                if (indicator) {
                    indicator.textContent = `📍 ${branch.name}`;
                }
                if (modalBranchName) {
                    modalBranchName.textContent = `${branch.name} (${branch.address})`;
                }
            }
        }

        // --- CART LOGIC ---
        let cart = [];

        function getCart() {
            return cart;
        }

        function addToCart(id, name, price, option = "") {
            const existingItem = cart.find(item => item.id === id && item.option === option);

            if (existingItem) {
                existingItem.qty += 1;
            } else {
                cart.push({ id, name, price: parseFloat(price), qty: 1, option });
            }

            updateCartUI();
        }

        function changeQty(id, option, delta) {
            const idx = cart.findIndex(item => item.id === id && item.option === option);
            if (idx !== -1) {
                cart[idx].qty += delta;
                if (cart[idx].qty <= 0) {
                    cart.splice(idx, 1);
                }
                updateCartUI();
            }
        }

        function getCartTotal() {
            return cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
        }

        function getCartCount() {
            return cart.reduce((sum, item) => sum + item.qty, 0);
        }

        function updateCartUI() {
            const container = document.getElementById("cart-items-container");
            const badge = document.getElementById("cart-badge");
            const totalPriceEl = document.getElementById("cart-total-price");
            const checkoutBtn = document.getElementById("checkout-btn");

            if (!container) return;

            const totalCount = getCartCount();
            if (badge) badge.textContent = totalCount;

            if (checkoutBtn) {
                checkoutBtn.disabled = totalCount === 0;
            }

            if (cart.length === 0) {
                container.innerHTML = `<div class="cart-empty-message">Tu carrito está vacío 🍗</div>`;
                if (totalPriceEl) totalPriceEl.textContent = "$0.00 MXN";
                return;
            }

            container.innerHTML = cart.map(item => `
                <div class="cart-item">
                    <div class="cart-item-details">
                        <h4>${item.name}</h4>
                        ${item.option ? `<p class="cart-item-option">${item.option}</p>` : ""}
                        <span class="cart-item-price">$${(item.price * item.qty).toFixed(2)} MXN</span>
                    </div>
                    <div class="cart-item-quantity-controls">
                        <button class="qty-btn" data-id="${item.id}" data-option="${item.option}" data-action="dec">-</button>
                        <span class="qty-val">${item.qty}</span>
                        <button class="qty-btn" data-id="${item.id}" data-option="${item.option}" data-action="inc">+</button>
                    </div>
                </div>
            `).join("");

            container.querySelectorAll(".qty-btn").forEach(btn => {
                btn.addEventListener("click", (e) => {
                    const id = btn.getAttribute("data-id");
                    const option = btn.getAttribute("data-option");
                    const action = btn.getAttribute("data-action");
                    const delta = action === "inc" ? 1 : -1;
                    changeQty(id, option, delta);
                });
            });

            if (totalPriceEl) {
                totalPriceEl.textContent = `$${getCartTotal().toFixed(2)} MXN`;
            }
        }

        // --- WHATSAPP REDIRECTION LOGIC ---
        // El formato de este mensaje es solo un punto de partida — personalízalo
        // como quieras (emojis, orden de los campos, textos, etc.).
        function sendOrderToWhatsApp(customerName, method, address, notes) {
            if (address === undefined) address = "";
            if (notes === undefined) notes = "";

            var activeBranch = getActiveBranch();
            if (!activeBranch) {
                alert("Por favor, selecciona una sucursal primero.");
                return;
            }

            var currentCart = getCart();
            var total = getCartTotal();

            // Build message using String.fromCodePoint for emoji compatibility
            // This builds proper Unicode strings that encodeURIComponent handles as %F0%9F... (4-byte UTF-8)
            var box     = String.fromCodePoint(0x1F4E6);  // 📦
            var person  = String.fromCodePoint(0x1F464);  // 👤
            var pin     = String.fromCodePoint(0x1F4CD);  // 📍
            var house   = String.fromCodePoint(0x1F3E0);  // 🏠
            var notepad = String.fromCodePoint(0x1F4CB);  // 📋
            var money   = String.fromCodePoint(0x1F4B0);  // 💰
            var bubble  = String.fromCodePoint(0x1F4AC);  // 💬

            var orderTitle = (business && business.whatsappOrderTitle) || "NUEVO PEDIDO";
            var businessName = (business && business.name) || "";

            var msg = box + " *¡" + orderTitle + (businessName ? " - " + businessName.toUpperCase() : "") + "!* " + box + "\n";
            msg += "--------------------------------------\n";
            msg += person + " *Cliente:* " + customerName + "\n";
            msg += pin + " *Método:* " + (method === "recoger" ? "Para Recoger (" + activeBranch.name + ")" : "Envío a Domicilio") + "\n";
            if (method === "domicilio" && address) {
                msg += house + " *Dirección:* " + address + "\n";
            }
            msg += "\n" + notepad + " *Detalle del Pedido:*\n";

            currentCart.forEach(function(item) {
                var sauceText = item.option ? " (" + item.option + ")" : "";
                msg += "• " + item.qty + "x " + item.name + sauceText + " - $" + (item.price * item.qty).toFixed(2) + " MXN\n";
            });

            msg += "\n" + money + " *Total a Pagar:* $" + total.toFixed(2) + " MXN\n";
            msg += "--------------------------------------\n";
            if (notes) {
                msg += bubble + " *Notas:* " + notes + "\n";
            }
            msg += "\n¡Espero su confirmación!";

            // Redirección híbrida: app nativa en móvil, enlace web en escritorio
            var isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            var baseWhatsAppUrl = isMobile ? "whatsapp://send" : "https://api.whatsapp.com/send";
            var encodedMsg = encodeURIComponent(msg);
            window.location.href = baseWhatsAppUrl + "?phone=" + activeBranch.phone + "&text=" + encodedMsg;
        }

        // --- RENDERIZADO DESDE CONFIGURACIÓN ---
        function renderBranding() {
            document.getElementById("site-logo").innerHTML =
                `<span class="logo-accent">${business.logoAccent}</span>${business.logoRest}`;
            document.getElementById("hero-title").textContent = business.heroTitle;
            document.getElementById("hero-subtitle").textContent = business.heroSubtitle;
        }

        function renderBranchOptions() {
            const container = document.getElementById("branch-options");
            container.innerHTML = business.branches.map(branch => `
                <button class="branch-option-btn" data-branch="${branch.key}">
                    <strong>${branch.name}</strong>
                    <span>${branch.address}</span>
                </button>
            `).join("");

            container.querySelectorAll(".branch-option-btn").forEach(btn => {
                btn.addEventListener("click", () => {
                    setActiveBranch(btn.getAttribute("data-branch"));
                    document.getElementById("branch-modal").classList.remove("open");
                });
            });
        }

        function renderMenu(menu) {
            const menuSection = document.getElementById("menu-section");
            menuSection.innerHTML = menu.categories.map(category => `
                <div class="category-block" style="margin-top: var(--spacing-xl);">
                    <h2 class="category-title">${category.title}</h2>
                    <div class="products-grid">
                        ${category.items.map(item => `
                            <div class="product-card" data-id="${item.id}" data-name="${item.name}" data-price="${item.price}">
                                <div class="product-info">
                                    <h3>${item.name}</h3>
                                    <p class="product-desc">${item.description}</p>
                                    ${item.sauces && item.sauces.length ? `
                                        <div class="customization-wrapper">
                                            <label>Elige una opción:</label>
                                            <select class="sauce-select">
                                                ${item.sauces.map(s => `<option value="${s}">${s}</option>`).join("")}
                                            </select>
                                        </div>
                                    ` : ""}
                                    <div class="product-footer">
                                        <span class="price">$${item.price.toFixed(2)} MXN</span>
                                        <button class="add-to-cart-btn">Agregar</button>
                                    </div>
                                </div>
                            </div>
                        `).join("")}
                    </div>
                </div>
            `).join("");

            menuSection.querySelectorAll(".product-card").forEach(card => {
                const addBtn = card.querySelector(".add-to-cart-btn");
                if (!addBtn) return;

                addBtn.addEventListener("click", () => {
                    const id = card.getAttribute("data-id");
                    const name = card.getAttribute("data-name");
                    const price = card.getAttribute("data-price");
                    const sauceSelect = card.querySelector(".sauce-select");
                    const option = sauceSelect ? sauceSelect.value : "";

                    addToCart(id, name, price, option);
                    openCart();
                });
            });
        }

        // --- GLOBAL EVENT COORDINATION ---
        let openCart, closeCart;

        document.addEventListener("DOMContentLoaded", async () => {
            // Elements
            const branchModal = document.getElementById("branch-modal");
            const checkoutModal = document.getElementById("checkout-modal");
            const checkoutCloseBtn = document.getElementById("checkout-close-btn");
            const activeBranchIndicator = document.getElementById("active-branch-indicator");

            const cartSidebar = document.getElementById("cart-sidebar");
            const cartToggleBtn = document.getElementById("cart-toggle-btn");
            const cartCloseBtn = document.getElementById("cart-close-btn");
            const sidebarOverlay = document.getElementById("sidebar-overlay");

            const checkoutBtn = document.getElementById("checkout-btn");
            const checkoutForm = document.getElementById("checkout-form");
            const deliveryMethodRadios = document.getElementsByName("delivery-method");
            const addressGroup = document.getElementById("address-group");
            const customerAddress = document.getElementById("customer-address");

            // Cargar configuración del negocio y menú
            try {
                const [businessRes, menuRes] = await Promise.all([
                    fetch("data/business.json"),
                    fetch("data/menu.json")
                ]);
                business = await businessRes.json();
                const menu = await menuRes.json();

                branches = {};
                business.branches.forEach(branch => { branches[branch.key] = branch; });

                renderBranding();
                renderBranchOptions();
                renderMenu(menu);
            } catch (error) {
                document.getElementById("menu-section").innerHTML =
                    '<p style="color: var(--color-secondary); text-align: center;">No se pudo cargar la configuración del sitio.</p>';
                return;
            }

            // Check for active branch in localStorage
            const savedBranch = getActiveBranchKey();
            const defaultBranchKey = business.branches[0] && business.branches[0].key;
            if (!savedBranch && defaultBranchKey) {
                setActiveBranch(defaultBranchKey);
            } else if (savedBranch) {
                setActiveBranch(savedBranch);
            }

            // Show/Hide active branch indicator triggers modal
            activeBranchIndicator.addEventListener("click", () => {
                branchModal.classList.add("open");
            });

            // Cart sidebar toggle controls
            openCart = () => {
                cartSidebar.classList.add("open");
                sidebarOverlay.classList.add("active");
            };

            closeCart = () => {
                cartSidebar.classList.remove("open");
                sidebarOverlay.classList.remove("active");
            };

            cartToggleBtn.addEventListener("click", openCart);
            cartCloseBtn.addEventListener("click", closeCart);
            sidebarOverlay.addEventListener("click", closeCart);

            // Checkout form interactions
            checkoutBtn.addEventListener("click", () => {
                closeCart();
                checkoutModal.classList.add("open");
            });

            checkoutCloseBtn.addEventListener("click", () => {
                checkoutModal.classList.remove("open");
            });

            // Delivery details display switch
            deliveryMethodRadios.forEach(radio => {
                radio.addEventListener("change", (e) => {
                    if (e.target.value === "domicilio") {
                        addressGroup.style.display = "block";
                        customerAddress.required = true;
                    } else {
                        addressGroup.style.display = "none";
                        customerAddress.required = false;
                        customerAddress.value = "";
                    }
                });
            });

            // Submit form
            checkoutForm.addEventListener("submit", (e) => {
                e.preventDefault();
                const name = document.getElementById("customer-name").value;
                const method = document.querySelector('input[name="delivery-method"]:checked').value;
                const address = customerAddress.value;
                const notes = document.getElementById("customer-notes").value;

                sendOrderToWhatsApp(name, method, address, notes);
                checkoutModal.classList.remove("open");
            });

            // Trigger initial UI rendering empty cart
            updateCartUI();
        });
    </script>
</body>
</html>
